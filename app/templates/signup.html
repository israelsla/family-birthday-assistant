{% extends "base.html" %}

{% block title %}הרשמה - Family Birthday Assistant{% endblock %}

{% block content %}
<h1 class="page-title">הרשמת משפחה חדשה</h1>

<form class="member-form" method="post">
    <label>
        שם המשפחה לתצוגה
        <input type="text" name="family_name" placeholder="למשל: משפחת ישראלי" value="{{ family_name }}">
    </label>

    <label>
        אימייל
        <input type="email" name="email" required value="{{ email }}">
    </label>

    <label>
        סיסמה (לפחות 8 תווים)
        <input type="password" name="password" required minlength="8">
    </label>

    <label>
        אימות סיסמה
        <input type="password" name="password_confirm" required minlength="8">
    </label>

    <div class="form-actions">
        <button type="submit" class="button">הרשמה</button>
    </div>
</form>

<p class="empty-state">יש לך כבר חשבון? <a href="{{ url_for('auth.login') }}">התחברות</a></p>
{% endblock %}
